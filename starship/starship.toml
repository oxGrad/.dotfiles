"$schema" = 'https://starship.rs/config-schema.json'

palette = 'monokai'

format = """\
[](fg:base)$os$directory\
([](bg:base fg:muted)$git_branch$git_status)\
([](bg:base fg:muted)$c$golang$java$kotlin$lua$nodejs$bun$deno$python$ruby$rust$php$zig$dart)\
([](bg:base fg:muted)$kubernetes)\
([](bg:base fg:muted)$cmd_duration)\
[](fg:base)\
$line_break$character"""

[kubernetes]
format = '[ 󱃾 $context( \\($namespace\\)) ]($style)'
style = 'bg:base fg:subtext'
disabled = false

[aws]
symbol = "  "

[buf]
symbol = " "

[bun]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[c]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

# [cpp]
# symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[deno]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[directory]
format = '[ $path$read_only ]($style)'
style = 'bg:base fg:bonewhite'
read_only = " 󰌾"

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[gcloud]
symbol = "  "

[git_branch]
format = '[ $symbol$branch ]($style)'
style = 'bg:base fg:bonewhite'
symbol = " "

# [git_commit]
# tag_symbol = '  '

[golang]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "

[java]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[julia]
symbol = " "

[kotlin]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[lua]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

[nodejs]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[ocaml]
symbol = " "

[os]
disabled = false
format = '[ $symbol]($style)'
style = 'bg:base fg:bonewhite'

[os.symbols]
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
HardenedBSD = "󰞌 "
Kali = " "
Linux = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
OpenBSD = "󰈺 "
openSUSE = " "
Pop = " "
Raspbian = " "
Redhat = " "
RockyLinux = " "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "

[package]
symbol = "󰏗 "

[perl]
symbol = " "

[php]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[pijul_channel]
symbol = " "

# [pixi]
# symbol = "󰏗 "

[python]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[rlang]
symbol = "󰟔 "

[ruby]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[rust]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = "󱘗 "

[scala]
symbol = " "

[swift]
symbol = " "

[zig]
format = '[ $symbol($version) ]($style)'
style = 'bg:base fg:subtext'
symbol = " "

[gradle]
symbol = " "

[git_status]
format = '([$all_status$ahead_behind ]($style))'
style = 'bg:base fg:yellow'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
modified = '!${count}'
staged = '+${count}'
untracked = '?${count}'
conflicted = '=${count}'
deleted = '✘${count}'
renamed = '»${count}'
stashed = '≡'

[cmd_duration]
min_time = 2000
format = '[  $duration ]($style)'
style = 'bg:base fg:yellow'

[character]
success_symbol = '[❯](bold fg:bonewhite)'
error_symbol = '[❯](bold fg:pink)'

[[kubernetes.contexts]]
context_pattern = '.*prod.*'
style = 'bg:base fg:pink'

[palettes.monokai]
base = '#272822'
bonewhite = '#faf9f6'
subtext = '#c2c2bf'
muted = '#90908a'
green = '#a6e22e'
yellow = '#e2e22e'
pink = '#f92672'
sky = '#66d9ef'
mauve = '#ae81ff'
